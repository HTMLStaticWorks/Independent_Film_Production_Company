<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="globeGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1" />
    </radialGradient>
  </defs>
  <!-- Basic Globe Shape -->
  <circle cx="50" cy="50" r="45" stroke="url(#globeGrad)" stroke-width="2" fill="none" opacity="0.6" />
  <!-- Meridians and Parallels -->
  <ellipse cx="50" cy="50" rx="45" ry="18" stroke="url(#globeGrad)" stroke-width="1.5" fill="none" opacity="0.4" />
  <ellipse cx="50" cy="50" rx="18" ry="45" stroke="url(#globeGrad)" stroke-width="1.5" fill="none" opacity="0.4" />
  <path d="M5 50 L95 50 M50 5 L50 95" stroke="url(#globeGrad)" stroke-width="1" opacity="0.3" />
  <!-- Continent-Like Shapes (Simplified abstraction) -->
  <path d="M30 35 Q40 30 50 35 T70 30 M25 55 Q35 60 45 55 T65 60" stroke="url(#globeGrad)" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- Dots (Major distribution hubs) -->
  <circle cx="50" cy="50" r="3" fill="#FFF" />
  <circle cx="25" cy="40" r="2" fill="#FFF" opacity="0.8" />
  <circle cx="75" cy="45" r="2" fill="#FFF" opacity="0.8" />
  <circle cx="40" cy="70" r="2" fill="#FFF" opacity="0.8" />
  <circle cx="60" cy="20" r="2" fill="#FFF" opacity="0.8" />
</svg>
