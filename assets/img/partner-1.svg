<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Main Camera Body -->
  <rect x="25" y="40" width="40" height="30" rx="2" fill="url(#goldGrad)" />
  <!-- Side Reels -->
  <circle cx="35" cy="30" r="10" fill="url(#goldGrad)" />
  <circle cx="55" cy="30" r="10" fill="url(#goldGrad)" />
  <!-- Inner Detail for Reels -->
  <circle cx="35" cy="30" r="4" fill="#000" />
  <circle cx="55" cy="30" r="4" fill="#000" />
  <!-- Lens Part -->
  <path d="M65 45 L80 35 L80 75 L65 65 Z" fill="url(#goldGrad)" />
  <!-- Highlights -->
  <path d="M28 43 L62 43" stroke="#FFF" stroke-width="1" stroke-linecap="round" opacity="0.3" />
