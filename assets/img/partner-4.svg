  <path d="M30 15 L30 25 M50 15 L50 25 M70 15 L70 25" stroke="url(#chipGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M30 75 L30 85 M50 75 L50 85 M70 75 L70 85" stroke="url(#chipGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M15 30 L25 30 M15 50 L25 50 M15 70 L25 70" stroke="url(#chipGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M75 30 L85 30 M75 50 L85 50 M75 70 L85 70" stroke="url(#chipGrad)" stroke-width="3" stroke-linecap="round" />
  <!-- Central Sparkle -->
  <circle cx="50" cy="50" r="5" fill="#FFF" opacity="0.8" />
  <path d="M50 42 L50 58 M42 50 L58 50" stroke="#FFF" stroke-width="2" stroke-linecap="round" />
</svg>
