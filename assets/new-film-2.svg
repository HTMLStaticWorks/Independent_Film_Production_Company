  <circle cx="501" cy="86" r="12" fill="#d4af37"/>
  <text x="56" y="104" fill="#7fe8ff" font-family="Arial, sans-serif" font-size="26" letter-spacing="7">SCI-FI / ACTION</text>
  <text x="54" y="348" fill="#ffffff" font-family="Arial, sans-serif" font-size="72" font-weight="800">NEON</text>
  <text x="54" y="422" fill="#ffffff" font-family="Arial, sans-serif" font-size="72" font-weight="800">SHADOWS</text>
  <text x="58" y="462" fill="#d4af37" font-family="Arial, sans-serif" font-size="24" letter-spacing="6">FEATURE FILM / 2023</text>
</svg>
