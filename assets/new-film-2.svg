<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Neon Shadows poster</title>
  <desc id="desc">A neon-lit sci-fi poster for Neon Shadows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#04070b"/>
      <stop offset="50%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#020203"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" x2="1">
      <stop offset="0%" stop-color="#30d5ff"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect x="520" y="0" width="70" height="500" fill="#0a0f19" opacity="0.75"/>
  <rect x="610" y="0" width="26" height="500" fill="#30d5ff" opacity="0.22"/>
  <rect x="660" y="0" width="12" height="500" fill="#d4af37" opacity="0.3"/>
