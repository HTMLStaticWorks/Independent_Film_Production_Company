<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <link rel="shortcut icon" type="image/png" href="assets/img/favicon.png">
    <title>Investor Login | Lumina Cinema</title>

    <!-- SEO Meta Tags -->
    <meta name="robots" content="noindex, nofollow">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 0;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 2rem;
            width: 100%;
            max-width: 450px;
            position: relative;
        }

        .auth-tab-switcher {
            display: flex;
            border-bottom: 1px solid var(--border-color, #333);
            margin-bottom: 1.25rem;
        }

        .auth-tab-switcher a {
            flex: 1;
            text-align: center;
            padding: 0.75rem 0;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-decoration: none;
            color: #6c757d;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .auth-tab-switcher a:hover {
            color: #ccc;
        }

        .auth-tab-switcher a.active {
            color: var(--primary, #c9a84c);
            border-bottom-color: var(--primary, #c9a84c);
        }

        .auth-utils {
            position: fixed;
            top: 2rem;
            right: 2rem;
            display: flex;
            gap: 0.5rem;
            z-index: 1000;
        }

        .or-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1rem 0;
        }

        .or-divider::before,
        .or-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color, #333);
        }

        .or-divider span {
            color: #6c757d;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            white-space: nowrap;
        }

        .password-field-container {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6c757d;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            z-index: 10;
        }

        .password-toggle:hover {
            color: var(--primary);
        }
    </style>
</head>

<body class="bg-noir">
    <!-- Utility Toggles (top-right corner) -->
    <div class="auth-utils">
        <button id="themeToggle" type="button" class="btn btn-outline-cinema p-2 lh-1 border-0"
            aria-label="Toggle Theme">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="text-primary">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
            </svg>
        </button>
        <button id="rtlToggle" type="button" class="btn btn-outline-cinema p-2 lh-1 border-0"
            aria-label="Toggle RTL">LTR</button>
    </div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Brand -->
            <div class="d-flex justify-content-center mb-3 mt-1">
                <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                    <div class="brand-text d-none d-sm-flex">
                        <span class="text-primary fw-bold letter-spacing-1">LUMINA</span>
                        <span class="text-theme fw-bold letter-spacing-1">CINEMA</span>
                    </div>
                </a>
            </div>


            <p class="text-muted small text-center mb-3">Access your production portfolio and financial reports.</p>

            <form action="#" class="needs-validation" novalidate>
                <div class="mb-2 text-start">
                    <label class="form-label small text-muted text-uppercase mb-1">Username or Email</label>
                    <input type="email" class="form-control py-2" placeholder="Enter your email" required>
                    <div class="invalid-feedback">Please enter a valid email.</div>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label small text-muted text-uppercase mb-1">Password</label>
                    <div class="password-field-container">
                        <input type="password" class="form-control py-2 pe-5" placeholder="Enter password" required>
                        <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div class="invalid-feedback">Field is required.</div>
                </div>

                <div class="mb-3 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <input type="checkbox" class="form-check-input me-2" id="rememberMe">
                        <label class="form-check-label text-muted small" for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="small text-primary text-decoration-none">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-cinema btn-primary-cinema w-100 py-2">Login to Portal</button>

                <!-- OR Divider -->
                <div class="or-divider">
                    <span>or continue with</span>
                </div>

                <!-- Social Login -->
                <div class="social-links-container">
                    <button type="button" class="btn-social-text btn-google"
                        onclick="alert('Google integration coming soon.')">
                        <i class="bi bi-google"></i> Google
                    </button>
                    <button type="button" class="btn-social-text btn-apple"
                        onclick="alert('Apple integration coming soon.')">
                        <i class="bi bi-apple"></i> Apple
                    </button>
                </div>
            </form>
            <div class="text-center mt-3">
                <p class="text-muted small mb-0">Not a partner yet? <a href="register.html"
                        class="text-primary fw-bold text-decoration-none">Register Here</a></p>
            </div>
        </div>
    </div>


    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.querySelectorAll('.password-toggle').forEach(button => {
            button.addEventListener('click', function () {
                const input = this.parentElement.querySelector('input');
                const svg = this.querySelector('svg');
                if (input.type === 'password') {
                    input.type = 'text';
                    svg.innerHTML = '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line>';
                } else {
                    input.type = 'password';
                    svg.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle>';
                }
            });
        });
    </script>
</body>

</html>
