<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <link rel="shortcut icon" type="image/png" href="assets/img/favicon.png">
    <title>Investor Login | Lumina Cinema</title>

    <!-- SEO Meta Tags -->
    <meta name="robots" content="noindex, nofollow">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .auth-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 2rem;
            width: 100%;
            max-width: 450px;
            position: relative;
        }
        .auth-tab-switcher {
            display: flex;
            border-bottom: 1px solid var(--border-color, #333);
            margin-bottom: 1.25rem;
        }
        .auth-tab-switcher a {
            flex: 1;
            text-align: center;
            padding: 0.75rem 0;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-decoration: none;
            color: #6c757d;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: color 0.2s ease, border-color 0.2s ease;
        }
        .auth-tab-switcher a:hover {
            color: #ccc;
        }
        .auth-tab-switcher a.active {
            color: var(--primary, #c9a84c);
            border-bottom-color: var(--primary, #c9a84c);
        }
        .auth-utils {
            position: fixed;
            top: 2rem;
            right: 2rem;
            display: flex;
            gap: 0.5rem;
            z-index: 1000;
        }
        .or-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1rem 0;
        }
        .or-divider::before,
        .or-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color, #333);
        }
        .or-divider span {
            color: #6c757d;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            white-space: nowrap;
        }
        .form-control:focus,
        .form-select:focus {
            box-shadow: none;
            border-color: var(--border-color, #444);
            outline: none;
        }
        .btn-google,
        .btn-apple {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.65rem 1rem;
            background: transparent;
            border: 1px solid var(--border-color, #444);
            color: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
            border-radius: 0;
        }
        .btn-google:hover {
            background: rgba(128,128,128,0.1);
            border-color: var(--primary, #c9a84c);
            color: var(--primary, #c9a84c);
        }
        .btn-apple {
            border-color: #fff;
            color: #fff;
            background: #000;
        }
        .btn-apple:hover {
            background: rgba(0, 0, 0, 0.8);
            border-color: #fff;
        }
        .btn-google svg,
        .btn-apple svg { flex-shrink: 0; }
    </style>
</head>

<body class="bg-noir">
    <!-- Utility Toggles (top-right corner) -->
    <div class="auth-utils">
        <button id="themeToggle" type="button" class="btn btn-outline-cinema p-2 lh-1 border-0" aria-label="Toggle Theme">
            <i class="bi bi-moon-stars-fill text-primary fs-5"></i>
        </button>
        <button id="rtlToggle" type="button" class="btn btn-outline-cinema p-1 border-0" title="Toggle RTL" aria-label="Toggle RTL direction">
            <span class="rtl-label" aria-hidden="true">RTL</span>
        </button>
    </div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Brand -->
            <div class="d-flex justify-content-center mb-3 mt-1">
                <div class="brand-text d-flex gap-2">
                    <span class="text-primary fw-bold letter-spacing-1">LUMINA</span>
                    <span class="text-theme fw-bold letter-spacing-1">CINEMA</span>
                </div>
            </div>

            <!-- Login | Sign Up Tab Switcher -->
            <div class="auth-tab-switcher mb-3">
                <a href="login.html" class="active" id="tab-login">Login</a>
                <a href="register.html" id="tab-signup">Sign Up</a>
            </div>

            <p class="text-muted small text-center mb-3">Access your production portfolio and financial reports.</p>

            <form action="#" class="needs-validation" novalidate>
                <div class="mb-2 text-start">
                    <label class="form-label small text-muted text-uppercase mb-1">Username or Email</label>
                    <input type="email" class="form-control bg-dark border-secondary text-white rounded-0 py-2" placeholder="Enter your email" required>
                    <div class="invalid-feedback">Please enter a valid email.</div>
                </div>
                <div class="mb-2 text-start">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label small text-muted text-uppercase mb-0">Password</label>
                        <a href="#" class="small text-primary text-decoration-none">Forgot?</a>
                    </div>
                    <input type="password" class="form-control bg-dark border-secondary text-white rounded-0 py-2" placeholder="Enter password" required>
                    <div class="invalid-feedback">Field is required.</div>
                </div>
                <div class="mb-3 d-flex align-items-center">
                    <input type="checkbox" class="form-check-input bg-dark border-secondary me-2" id="rememberMe">
                    <label class="form-check-label text-muted small" for="rememberMe">Remember for 30 days</label>
                </div>
                <button type="submit" class="btn btn-cinema btn-primary-cinema w-100 py-2">Login to Portal</button>

                <!-- OR Divider -->
                <div class="or-divider">
                    <span>or continue with</span>
                </div>

                <!-- Google Sign-In -->
                <button type="button" class="btn-google" onclick="alert('Google OAuth integration coming soon.')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                        <path fill="none" d="M0 0h48v48H0z"/>
                    </svg>
                    Continue with Google
                </button>
                <button type="button" class="btn-apple" onclick="alert('Apple Sign-In integration coming soon.')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M16.071 1.53c0 1.14-.76 2.34-1.62 3.03-.83.66-1.8 1.15-2.63 1.03-.11-.79.29-1.88.86-2.62.59-.78 1.44-1.47 2.35-1.47.1 0 .2.01.35.05.15.05.2.09.2.16zM12 5.5c1.66-1.3 2.43-3.33 2.22-4.74-.9.04-2.17.6-2.9 1.35A4.403 4.403 0 0 0 9 3.75c-.03.27-.1.54-.1.84-.05 1.03.12 2.07.43 2.91.5 1.38 1.6 2.44 2.67 2.44.44 0 .9-.17 1.4-.41.34-.16.61-.33.8-.5-.06-.63-.27-1.31-.8-1.8-.43-.38-1.03-.64-1.75-.79-.52-.11-1.03-.17-1.55-.17-.6 0-1.18.09-1.75.27 1.03-1.02 2.39-1.64 3.66-1.64zM18.5 10.5c-.66.22-2.39.95-2.82 2.23-.2.34-.34.67-.27.96.07.3.24.6.62.75.8.32 1.76.18 2.46-.4.52-.46.92-1.2.92-2.01 0-.45-.1-.92-.46-1.53zm-7.64.17c.05-.01.12-.02.17-.02.41 0 .82.15 1.21.46.26.19.48.43.7.68.32.35.63.73.83 1.31.14.35.19.69.08.98-.11.28-.4.5-.74.54-.26.03-.57-.08-.92-.33-.6-.42-1.04-.83-1.44-1.23-.32-.32-.69-.62-1-1.3-.25-.53-.4-1.01-.4-1.46 0-.53.2-.93.55-1.2.5-.4 1.1-.45 1.72-.45.21 0 .42.02.64.06z"/>
                    </svg>
                    Continue with Apple
                </button>
            </form>
            <div class="text-center mt-3">
                <p class="text-muted small mb-2">Not a partner yet? <a href="register.html" class="text-primary fw-bold text-decoration-none">Register Here</a></p>
                <hr class="border-secondary my-3">
                <a href="index.html" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-2"></i>Back to Home</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
